  <path d="M150 250 L230 240 L240 280 L200 310 L140 290 Z" fill="#8c6a9a" />
  <path d="M500 220 L530 150 L580 190 L570 260 L520 270 Z" fill="#d9d2c3"/>
  <!-- tangled alliance ropes between capitals -->
  <g fill="none" stroke="#f4ead8" stroke-width="5" stroke-linecap="round">
    <path d="M200 180 C260 90 330 260 340 140"/>
    <path d="M340 140 C400 220 440 80 450 160"/>
    <path d="M200 180 C230 280 330 330 320 250"/>
    <path d="M320 250 C380 190 420 290 450 160"/>
    <path d="M450 160 C500 120 540 240 545 215"/>
    <path d="M340 140 C300 200 250 150 200 180"/>
