  <path d="M280 170 L250 110 L330 70 L400 100 L390 170 L330 200 Z" fill="#e9b44c"/>
  <path d="M390 170 L400 100 L480 90 L530 150 L500 220 L420 230 Z" fill="#4f8a6b"/>
