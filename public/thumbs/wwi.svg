  <g fill="#f4ead8">
    <circle cx="200" cy="180" r="11"/>
    <circle cx="340" cy="140" r="11"/>
    <circle cx="450" cy="160" r="11"/>
    <circle cx="320" cy="250" r="11"/>
    <circle cx="545" cy="215" r="11"/>
  </g>
  <g fill="#40201e">
    <circle cx="200" cy="180" r="5"/>
    <circle cx="340" cy="140" r="5"/>
    <circle cx="450" cy="160" r="5"/>
    <circle cx="320" cy="250" r="5"/>
    <circle cx="545" cy="215" r="5"/>
  </g>
  <!-- a spark at the knot of the ropes -->
  <path d="M330 168 L338 188 L358 196 L338 204 L330 224 L322 204 L302 196 L322 188 Z" fill="#ffd166"/>
</svg>
